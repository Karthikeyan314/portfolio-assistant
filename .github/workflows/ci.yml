name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Includes the privacy check and fails if chunks.jsonl is out of date.
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-assistant .
      - name: App starts and serves
        run: |
          docker run -d --name app -p 7860:7860 portfolio-assistant
          for i in $(seq 1 30); do curl -fs localhost:7860/_stcore/health && exit 0; sleep 2; done
          docker logs app; exit 1
