[project]
name = "portfolio-assistant"
version = "0.1.0"
description = "A chatbot that answers questions about Karthikeyan Nagaraju's work"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
